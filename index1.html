<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase Popup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="display-6 fw-bold"></h1>
    <p class="lead text-secondary"></p>
    <div class="d-flex gap-2 flex-wrap">
      <button id="toggleBtn" class="btn btn-dark">Pause popups</button>
      <button id="nowBtn" class="btn btn-outline-dark">Show one now</button>
    </div>
  </main>

  <div id="popupHost" class="popup-host" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app1.js"></script>
</body>
</html>
